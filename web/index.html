<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UniverCopy — Protótipo</title>
<style>
:root{
  color-scheme:light;
  --bg-primary:#f6f7fb;--bg-secondary:#ffffff;--bg-tertiary:#eef0f6;--bg-elev:#fbfbfe;
  --border:#e4e6ee;--text-primary:#1a1d27;--text-secondary:#4b5163;--text-muted:#8b92a5;
  --primary:#6366f1;--primary-hover:#8b5cf6;--success:#10b981;--danger:#ef4444;--amber:#f59e0b;--pink:#ec4899;
  --radius-sm:8px;--radius:12px;--radius-lg:16px;--sidebar:248px;
}
[data-theme="dark"]{
  --bg-primary:#0f1117;--bg-secondary:#171a23;--bg-tertiary:#1f2330;--bg-elev:#1c2030;
  --border:#2a2f3d;--text-primary:#f3f4f6;--text-secondary:#c4c9d4;--text-muted:#8b92a5;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg-primary);color:var(--text-primary);font-size:14px;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px}
.app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar);background:var(--bg-secondary);border-right:1px solid var(--border);position:fixed;top:0;bottom:0;left:0;display:flex;flex-direction:column;padding:16px 12px;gap:4px;z-index:50}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px}
.brand-icon{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--primary),var(--primary-hover));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:1.1rem;box-shadow:0 4px 14px rgba(99,102,241,.4)}
.brand-name{font-weight:800;font-size:1.05rem;letter-spacing:-.02em}
.brand-name span{color:var(--primary-hover)}
.ws-select{margin:0 4px 10px;background:var(--bg-tertiary);border:1px solid var(--border);border-radius:10px;padding:9px 11px;display:flex;align-items:center;gap:9px;cursor:pointer}
.ws-dot{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#f59e0b,#ec4899);display:flex;align-items:center;justify-content:center;font-size:.8rem}
.ws-meta b{display:block;font-size:.8rem}.ws-meta small{color:var(--text-muted);font-size:.66rem}
.nav-label{font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);font-weight:700;padding:10px 12px 4px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;cursor:pointer;color:var(--text-secondary);font-weight:500;font-size:.85rem;transition:.15s}
.nav-item:hover{background:var(--bg-tertiary);color:var(--text-primary)}
.nav-item.active{background:linear-gradient(135deg,rgba(99,102,241,.14),rgba(139,92,246,.14));color:var(--text-primary);font-weight:600}
.nav-item.active .ni-ic{color:var(--primary-hover)}
.ni-ic{width:18px;height:18px;flex:none;color:var(--text-muted)}
.nav-item .badge{margin-left:auto;background:var(--bg-tertiary);color:var(--text-muted);font-size:.66rem;font-weight:700;padding:1px 7px;border-radius:20px}
.sidebar-foot{margin-top:auto;padding-top:10px;border-top:1px solid var(--border)}
.main{margin-left:var(--sidebar);flex:1;padding:22px 26px 70px;max-width:1280px}
.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.ph-left{display:flex;align-items:center;gap:13px}
.ph-icon{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:1.35rem;color:#fff;box-shadow:0 4px 14px rgba(99,102,241,.32)}
.ph-title{margin:0;font-size:1.4rem;font-weight:800;letter-spacing:-.02em}
.ph-sub{margin:0;font-size:.76rem;color:var(--text-muted)}
.btn{border:1px solid var(--border);background:var(--bg-secondary);color:var(--text-secondary);border-radius:10px;padding:9px 15px;font-size:.8rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.15s;font-family:inherit}
.btn:hover{background:var(--bg-tertiary);color:var(--text-primary)}
.btn svg{width:15px;height:15px}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-hover));border:none;color:#fff;box-shadow:0 3px 12px rgba(99,102,241,.3)}
.btn-primary:hover{filter:brightness(1.08);color:#fff}
.btn-danger{border-color:var(--danger);color:var(--danger)}.btn-danger:hover{background:var(--danger);color:#fff}
.btn-sm{padding:6px 11px;font-size:.74rem;border-radius:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:11px;margin-bottom:18px}
.stat{background:var(--bg-secondary);border:1px solid var(--border);border-radius:13px;padding:14px 16px;display:flex;align-items:center;gap:13px}
.stat-ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none}
.stat-ic svg{width:19px;height:19px}
.stat-lbl{font-size:.64rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.stat-val{font-size:1.22rem;font-weight:800;letter-spacing:-.02em}
.toolbar{background:var(--bg-secondary);border:1px solid var(--border);border-radius:14px;padding:11px 14px;margin-bottom:14px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.search{position:relative;flex:1;min-width:180px;max-width:300px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--text-muted)}
input,select,textarea{background:var(--bg-primary);border:1px solid var(--border);color:var(--text-primary);border-radius:8px;height:36px;font-size:.8rem;padding:0 11px;font-family:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--primary)}
.search input{width:100%;padding-left:34px}
select{cursor:pointer;min-width:130px}
textarea{height:auto;padding:10px 12px;resize:vertical;line-height:1.5}
.sep{width:1px;height:22px;background:var(--border);margin:0 3px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:6px 13px;border-radius:30px;border:1px solid var(--border);background:var(--bg-secondary);color:var(--text-secondary);font-size:.76rem;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:7px;transition:.15s}
.chip:hover{background:var(--bg-tertiary)}
.chip.active{background:linear-gradient(135deg,var(--primary),var(--primary-hover));color:#fff;border-color:transparent}
.chip .ct{font-size:.66rem;opacity:.8}
.table-wrap{border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--bg-secondary)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:.66rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);font-weight:700;padding:12px 15px;border-bottom:1px solid var(--border);background:var(--bg-elev)}
td{padding:13px 15px;border-bottom:1px solid var(--border);font-size:.83rem;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer;transition:.12s}
tbody tr:hover{background:var(--bg-tertiary)}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:600}
.pill{padding:3px 10px;border-radius:20px;font-size:.7rem;font-weight:700}
.st-rascunho{background:rgba(139,146,165,.16);color:var(--text-muted)}
.st-revisao{background:rgba(245,158,11,.16);color:var(--amber)}
.st-aprovado{background:rgba(16,185,129,.16);color:var(--success)}
.st-publicado{background:rgba(99,102,241,.18);color:var(--primary-hover)}
.score{font-weight:800;font-size:.84rem}
.muted{color:var(--text-muted)}
.cardgrid{display:grid;gap:14px}
.gcard{background:var(--bg-secondary);border:1px solid var(--border);border-radius:15px;padding:17px;transition:.15s}
.gcard:hover{border-color:var(--primary);transform:translateY(-2px)}
.empty{text-align:center;padding:60px 20px;color:var(--text-muted)}
.empty-ic{width:66px;height:66px;border-radius:20px;background:linear-gradient(135deg,rgba(99,102,241,.12),rgba(139,92,246,.12));display:flex;align-items:center;justify-content:center;font-size:1.9rem;margin:0 auto 14px}
.section-card{background:var(--bg-secondary);border:1px solid var(--border);border-radius:15px;padding:20px;margin-bottom:16px}
.sc-title{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.field{margin-bottom:14px}
.field label{display:block;font-size:.74rem;font-weight:700;color:var(--text-secondary);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.kv{display:flex;gap:10px;margin-bottom:9px;align-items:flex-start}
.kv b{font-size:.74rem;color:var(--text-secondary);min-width:118px;flex:none}
.kv span{font-size:.83rem}
.taglist{display:flex;gap:6px;flex-wrap:wrap}
.minitag{background:var(--bg-tertiary);border:1px solid var(--border);padding:3px 9px;border-radius:7px;font-size:.72rem;color:var(--text-secondary)}
.back{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--text-muted);cursor:pointer;margin-bottom:12px;font-weight:600}
.back:hover{color:var(--text-primary)}
.ver{border-left:2px solid var(--border);padding:0 0 16px 18px;position:relative;margin-left:6px}
.ver:before{content:'';position:absolute;left:-7px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--primary);border:3px solid var(--bg-secondary)}
.ver.old:before{background:var(--text-muted)}
.comment{background:var(--bg-tertiary);border-radius:11px;padding:11px 13px;margin-bottom:9px}
.avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--pink));display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:.68rem;font-weight:700}
.master-ic{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;color:#fff;font-weight:800;flex:none}
.var-out{background:var(--bg-tertiary);border:1px solid var(--border);border-radius:12px;padding:15px;margin-bottom:12px;line-height:1.6;font-size:.86rem;white-space:pre-wrap}
.banner{background:linear-gradient(135deg,rgba(99,102,241,.10),rgba(236,72,153,.08));border:1px solid var(--border);border-radius:15px;padding:16px 18px;margin-bottom:18px;display:flex;gap:14px;align-items:center}
.flowstrip{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.flowstrip .minitag{font-weight:600}
.flowstrip .arr{color:var(--text-muted);font-weight:700}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text-primary);color:var(--bg-secondary);padding:11px 20px;border-radius:30px;font-size:.82rem;font-weight:600;opacity:0;transition:.25s;z-index:200;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.2)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:760px){.sidebar{width:64px}.brand-name,.ws-meta,.nav-item span:not(.badge),.nav-label{display:none}.main{margin-left:64px;padding:16px}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="brand-icon">U</div><div class="brand-name">Univer<span>Copy</span></div></div>
    <div class="ws-select">
      <div class="ws-dot" id="ws-dot">💇</div>
      <select id="wsSel" onchange="switchWs(this.value)" style="flex:1;min-width:0;height:32px;border-radius:8px;font-size:.82rem;font-weight:700;background:var(--bg-primary);border:1px solid var(--border);color:var(--text-primary);padding:0 8px"></select>
      <span title="Novo workspace / marca" onclick="novoWorkspace()" style="cursor:pointer;font-weight:800;color:var(--primary-hover);padding:0 6px;font-size:1.05rem">＋</span>
    </div>
    <div class="nav-label">Trabalho</div>
    <div class="nav-item" data-v="dash" onclick="nav('dash')"><svg class="ni-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span>Dashboard</span></div>
    <div class="nav-item" data-v="acervo" onclick="nav('acervo')"><svg class="ni-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h18M3 12h18M3 17h18"/></svg><span>Acervo</span><span class="badge" id="nav-acervo-count">0</span></div>
    <div class="nav-item" data-v="gerador" onclick="nav('gerador')"><svg class="ni-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3v4M3 5h4M6 17v4M4 19h4M13 3l2.5 6.5L22 12l-6.5 2.5L13 21l-2.5-6.5L4 12l6.5-2.5z"/></svg><span>Gerador de Copy</span></div>
    <div class="nav-item" data-v="catalogo" onclick="nav('catalogo')"><svg class="ni-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="7" rx="1"/><rect x="3" y="14" width="18" height="7" rx="1"/></svg><span>Catálogo de Peças</span></div>
    <div class="nav-item" data-v="revisao" onclick="nav('revisao')"><svg class="ni-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg><span>Revisão</span><span class="badge" id="nav-rev-count">0</span></div>
    <div class="nav-item" data-v="analise" onclick="nav('analise')"><svg class="ni-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg><span>Analisar Página</span></div>
    <div class="nav-label">Inteligência de marca</div>
    <div class="nav-item" data-v="dna" onclick="nav('dna')"><svg class="ni-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a4 4 0 014 4c0 2-2 3-2 6M12 2a4 4 0 00-4 4c0 2 2 3 2 6M8 12c0 3 2 4 2 6a2 2 0 104 0c0-2 2-3 2-6"/></svg><span>DNA da Marca</span></div>
    <div class="nav-item" data-v="referencias" onclick="nav('referencias')"><svg class="ni-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg><span>Referências</span></div>
    <div class="nav-item" data-v="estilos" onclick="nav('estilos')"><svg class="ni-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l2.4 7.4H22l-6 4.5 2.3 7.1-6.3-4.6L5.7 21 8 14 2 9.4h7.6z"/></svg><span>Estilos de Especialista</span></div>
    <div class="sidebar-foot">
      <div class="nav-item" onclick="toggleTheme()"><svg class="ni-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span id="theme-lbl">Tema escuro</span></div>
      <div class="nav-item" onclick="resetDemo()"><svg class="ni-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 109-9 9 9 0 00-6.7 3M3 3v6h6"/></svg><span>Restaurar exemplo</span></div>
    </div>
  </aside>
  <main class="main"><div id="view"></div></main>
</div>
<div id="toast"></div>

<script>
/* ====== CONSTANTES ====== */
const CATS=[
 {id:'ecom',nome:'E-commerce',ic:'🛒',cor:'#6366f1'},
 {id:'pv',nome:'Página de Vendas',ic:'📄',cor:'#ec4899'},
 {id:'ads',nome:'Anúncios',ic:'📣',cor:'#f59e0b'},
 {id:'email',nome:'E-mail',ic:'✉️',cor:'#10b981'},
 {id:'social',nome:'Redes Sociais',ic:'📱',cor:'#8b5cf6'},
 {id:'marca',nome:'Institucional / Marca',ic:'🏛️',cor:'#14b8a6'},
 {id:'seo',nome:'SEO / Blog',ic:'🔎',cor:'#0ea5e9'},
];
const FRAMEWORKS=['AIDA','AIDCA (AIDA + Convicção)','PAS (Problema-Agitação-Solução)','PASTOR','BAB (Antes-Depois-Ponte)','4 Ps','PPPP (Picture-Promise-Prove-Push)','FAB (Feature-Advantage-Benefit)','Star-Story-Solution','QUEST','ACCA',"4 U's (headline)",'USP (Proposta Única de Venda)','Slippery Slide (Sugarman)','Epiphany Bridge (Brunson)','5 Estágios de Consciência (Schwartz)','Fórmula de 7 passos (Bob Stone)'];
const FW_STRUCT={
 'AIDA':'Atenção → Interesse → Desejo → Ação',
 'AIDCA (AIDA + Convicção)':'Atenção → Interesse → Desejo → Convicção → Ação',
 'PAS (Problema-Agitação-Solução)':'Problema → Agitação → Solução',
 'PASTOR':'Problema → Amplificação → História/Solução → Transformação (depoimentos) → Oferta → Resposta (CTA)',
 'BAB (Antes-Depois-Ponte)':'Estado Antes → Estado Depois → Ponte (o produto)',
 '4 Ps':'Promessa → Imagem (Picture) → Prova → Empurrão (Push)',
 'PPPP (Picture-Promise-Prove-Push)':'Imagem → Promessa → Prova → Empurrão',
 'FAB (Feature-Advantage-Benefit)':'Característica → Vantagem → Benefício',
 'Star-Story-Solution':'Estrela (protagonista) → História → Solução',
 'QUEST':'Qualificar → Entender → Educar → Estimular → Transição (CTA)',
 'ACCA':'Consciência → Compreensão → Convicção → Ação',
 "4 U's (headline)":'Útil → Urgente → Único → Ultraespecífico',
 'USP (Proposta Única de Venda)':'Proposta única → Benefício exclusivo → Martelo (repetição)',
 'Slippery Slide (Sugarman)':'Primeira frase curtíssima → cada frase puxa a próxima → fechamento',
 'Epiphany Bridge (Brunson)':'História de origem → epifania → nova oportunidade → oferta',
 '5 Estágios de Consciência (Schwartz)':'Inconsciente → consciente do problema → da solução → do produto → totalmente consciente',
 'Fórmula de 7 passos (Bob Stone)':'Maior benefício → expandir → o que recebe → provar → o que perde se não agir → resumir → pedir ação',
};
const hexRgb=h=>{h=String(h).replace('#','');const n=parseInt(h,16);return ((n>>16)&255)+','+((n>>8)&255)+','+(n&255);};
const TIPOS={
 ecom:[
  {id:'desc-loja',nome:'Descrição do e-commerce / Sobre a loja',desc:'Texto institucional da home/sobre que apresenta a loja.',estrutura:'História → missão → diferenciais → convite',fw:'Star-Story-Solution',estilo:'olivetto',tam:'120-220 palavras'},
  {id:'desc-categoria',nome:'Descrição de categoria',desc:'Texto da página de categoria, com apelo e SEO.',estrutura:'Intro da categoria → variedade/benefícios → SEO natural → CTA navegar',fw:'AIDA',estilo:'ogilvy',tam:'60-120 palavras'},
  {id:'desc-prod-curta',nome:'Descrição de produto (curta)',desc:'Descrição objetiva para a vitrine do produto.',estrutura:'Gancho de benefício → 2-3 características → fecho',fw:'FAB (Feature-Advantage-Benefit)',estilo:'ogilvy',tam:'40-80 palavras'},
  {id:'desc-prod-longa',nome:'Descrição de produto (detalhada)',desc:'Descrição completa, persuasiva e com prova.',estrutura:'Abertura sensorial → benefícios → especificações (reason-why) → prova → CTA',fw:'FAB (Feature-Advantage-Benefit)',estilo:'hopkins',tam:'120-250 palavras'},
  {id:'sobre-produto',nome:'Sobre o produto (storytelling)',desc:'Narrativa que conecta o produto à vida do cliente.',estrutura:'História/origem → problema que resolve → uso no dia a dia',fw:'Star-Story-Solution',estilo:'halbert',tam:'80-150 palavras'},
  {id:'bullets',nome:'Bullets de benefícios',desc:'Lista de bullets persuasivos (fascinations).',estrutura:'Cada bullet = benefício + curiosidade',fw:"4 U's (headline)",estilo:'sugarman',tam:'4-7 bullets'},
  {id:'titulo-prod',nome:'Título de produto (otimizado)',desc:'Título de vitrine claro e com keyword.',estrutura:'Produto + atributo único + benefício/keyword',fw:'USP (Proposta Única de Venda)',estilo:'reeves',tam:'até 60 caracteres'},
  {id:'seo-meta',nome:'Título SEO + meta description',desc:'Tags para ranquear e atrair o clique.',estrutura:'Keyword no início → benefício → CTA',fw:'USP (Proposta Única de Venda)',estilo:'ogilvy',tam:'título ~60c / meta ~155c'},
  {id:'ficha',nome:'Ficha técnica (texto)',desc:'Especificações traduzidas em vantagens.',estrutura:'Especificação + a vantagem de cada uma',fw:'FAB (Feature-Advantage-Benefit)',estilo:'hopkins',tam:'lista'},

function wrapDna(b){if(b&&b.atual)return {usar:b.usar||'atual',atual:b.atual,proposto:b.proposto||emptyDna(b.atual.marca)};const f=b||{};const {id,...rest}=f;return {usar:'atual',atual:rest,proposto:emptyDna(rest.marca)};}
function loadDB(){let db;try{const s=localStorage.getItem('uc_db_v2');if(s)db=JSON.parse(s);}catch(e){}
  if(!db){try{const old=localStorage.getItem('uc_db_v1');if(old)db=JSON.parse(old);}catch(e){}}
  if(!db)db=seed();
  // migração: formatos antigos (dna único / dnas[] + copies/refs globais) → workspaces
  if(!db.workspaces){
    let dnas=db.dnas&&db.dnas.length?db.dnas:(db.dna?[{id:'b1',...db.dna}]:[{id:'b1',atual:emptyDna('Minha marca')}]);
    db.workspaces=dnas.map((b,i)=>{const dna=wrapDna(b);return {id:'ws-'+(b.id||i),nome:(dna.atual.marca||('Marca '+(i+1))),icon:'🧬',dna,copies:i===0?(db.copies||[]):[],refs:i===0?(db.refs||[]):[]};});
    db.activeWs=db.workspaces[0].id;delete db.dnas;delete db.activeDna;delete db.dna;delete db.copies;delete db.refs;
  }
  if(!db.workspaces.length)db.workspaces=seed().workspaces;
  db.workspaces.forEach(w=>{if(!w.dna)w.dna={usar:'atual',atual:emptyDna(w.nome),proposto:emptyDna(w.nome)};if(!w.dna.usar)w.dna.usar='atual';if(!w.copies)w.copies=[];if(!w.refs)w.refs=[];if(!w.icon)w.icon='🧬';});
  if(!db.activeWs||!db.workspaces.some(w=>w.id===db.activeWs))db.activeWs=db.workspaces[0].id;
  if(!db.seq)db.seq=100;
  return db;}

function drawChips(){

function filteredCopies(){

}
function drawAcervo(){
  const f=filteredCopies();
  const aprov=f.filter(c=>c.status==='aprovado'||c.status==='publicado').length;
  const rev=f.filter(c=>c.status==='revisao').length;
  const sc=f.filter(c=>c.score>0);const avg=sc.length?Math.round(sc.reduce((s,c)=>s+c.score,0)/sc.length):0;
  $('acervo-stats').innerHTML=statCard(IC.doc,'99,102,241','Resultados',f.length)+statCard(IC.check,'16,185,129','Aprovadas',aprov)+statCard('<path d="M9 11l3 3L22 4"/>','245,158,11','Em revisão',rev)+statCard(IC.star,'236,72,153','Score médio',avg||'—');

  $('acervo-body').innerHTML=`<div class="table-wrap"><table><thead><tr><th>Título</th><th>Categoria</th><th>Status</th><th>Estilo</th><th>Score</th><th>Atualizado</th><th style="width:90px">Ações</th></tr></thead><tbody>${f.map(c=>`<tr onclick="openCopy('${c.id}')">
    <td style="font-weight:600;max-width:280px">${esc(c.titulo)}<div class="muted" style="font-weight:400;font-size:.72rem">${esc(c.conteudo.slice(0,58))}…</div></td>
    <td><span class="tag" style="background:${cat(c.cat).cor}1f;color:${cat(c.cat).cor}">${cat(c.cat).ic} ${cat(c.cat).nome}</span></td>
    <td><span class="pill ${stClass[c.status]}">${stLabel[c.status]}</span></td>
    <td style="font-size:.78rem"><span style="color:${est(c.estilo).cor};font-weight:600">●</span> ${est(c.estilo).nome}</td>
    <td>${c.score?`<span class="score" style="color:${c.score>=85?'var(--success)':c.score>=75?'var(--amber)':'var(--text-secondary)'}">${c.score}</span>`:'<span class="muted">—</span>'}</td>
    <td class="muted" style="font-size:.76rem">${c.upd}</td>
    <td onclick="event.stopPropagation()"><span title="Editar" style="cursor:pointer;margin-right:10px" onclick="openEditor('${c.id}')">✏️</span><span title="Excluir" style="cursor:pointer" onclick="delCopy('${c.id}')">🗑️</span></td>
  </tr>`).join('')}</tbody></table></div>`;
}

function openEditor(id){

       <div class="field"><label>Título</label><input id="eTit" value="${esc(c?c.titulo:'')}" placeholder="Ex.: Descrição — Tênis Runner Pro X"></div>

       <div class="field"><label>Categoria</label><select id="eCat">${CATS.map(x=>`<option value="${x.id}" ${c&&c.cat===x.id?'selected':''}>${x.ic} ${x.nome}</option>`).join('')}</select></div>
       <div class="field"><label>Status</label><select id="eStatus">${['rascunho','revisao','aprovado','publicado'].map(s=>`<option value="${s}" ${c&&c.status===s?'selected':''}>${stLabel[s]}</option>`).join('')}</select></div>

       <div class="field"><label>Framework</label><select id="eFw">${FRAMEWORKS.map(f=>`<option ${c&&c.fw===f?'selected':''}>${f}</option>`).join('')}</select></div>
     </div>
     <div class="field"><label>Conteúdo da copy</label><textarea id="eCont" rows="7" placeholder="Escreva ou cole a copy aqui...">${esc(c?c.conteudo:'')}</textarea></div>
     <div style="display:flex;gap:8px">
       <button class="btn btn-primary" onclick="saveEditor()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${IC.check}</svg> Salvar copy</button>
       ${c?`<button class="btn btn-danger" onclick="delCopy('${c.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${IC.trash}</svg> Excluir</button>`:''}
       <button class="btn" onclick="nav('acervo')">Cancelar</button>
     </div>
   </div>`;
}
function saveEditor(){
  const id=window._editId;
  const data={titulo:$('eTit').value.trim()||'(sem título)',marca:$('eMarca').value.trim(),cat:$('eCat').value,status:$('eStatus').value,estilo:$('eEst').value,fw:$('eFw').value,conteudo:$('eCont').value.trim()};
  if(id){
    const c=ws().copies.find(x=>x.id===id);const changed=c.conteudo!==data.conteudo;
    Object.assign(c,data);c.upd='agora';
    if(changed){c.versoes.forEach(v=>v.atual=false);const n=Math.max(0,...c.versoes.map(v=>v.n))+1;c.versoes.unshift({n,autor:'Você',data:'agora',nota:'Edição manual',atual:true});}
    saveDB();toast('Copy atualizada');openCopy(id);
  }else{
    const nid=DB.seq++;
    ws().copies.unshift({id:nid,...data,score:0,upd:'agora',versoes:[{n:1,autor:'Você',data:'agora',nota:'Criação manual',atual:true}],coment:[]});
    saveDB();toast('Copy criada no acervo');openCopy(nid);
  }
}
function delCopy(id){if(!confirm('Excluir esta copy do acervo?'))return;ws().copies=ws().copies.filter(x=>x.id!==id);saveDB();toast('Copy excluída');nav('acervo');}

function buildPrompt(brief,catId,fw,estiloId,refId,tipoId){

  const Lpeca=t?`# PEÇA A CRIAR — ${t.nome}\nO que é: ${t.desc}\nEstrutura sugerida: ${t.estrutura}\nExtensão: ${t.tam}`:'';
  const L1=`# DNA DA MARCA (${d.marca})\n- Posicionamento: ${d.posicionamento}\n- Tom de voz: ${d.tom}\n- Público: ${d.publico}\n- Estágio de consciência: ${d.consciencia}\n- Provas disponíveis: ${(d.provas||[]).join('; ')}\n- Objeções a tratar: ${(d.objecoes||[]).join(' | ')}\n- NÃO usar estas palavras/expressões: ${(d.evitar||[]).join(', ')}`;
  const L2=`# LENTE DO ESPECIALISTA — ${e.nome} (${e.ep})\n${e.desc}\nEscreva seguindo estes princípios: ${(e.princ||[]).join('; ')}.`;
  const L3=`# FRAMEWORK — ${fw}\nEstruture a copy nesta ordem: ${FW_STRUCT[fw]||fw}.`;
  const L5=r?`# REFERÊNCIA (inspiração de estrutura e ângulo — NÃO copiar)\n${r.titulo} (${r.fonte}): ${r.notas}`:'';
  const L4=`# TAREFA\nEscreva ${t?'a peça "'+t.nome+'"':'uma copy de "'+c.nome+'"'} (categoria ${c.nome}) sobre: ${brief}.\nGere 2 variações distintas em português do Brasil, separadas por uma linha com apenas "---".\nRespeite o tom da marca, trate ao menos uma objeção e evite as palavras proibidas. Sem preâmbulos — entregue só a copy.`;
  const full=[Lpeca,L1,L2,L3,L5,L4].filter(Boolean).join('\n\n');
  return {Lpeca,L1,L2,L3,L4,L5,full,e,c,fw,r,tipo:t};

  const b=activeBrand();b[window._dnaTab]=readDnaForm();const src=b.atual;
  const fw=$('dnaFw')?$('dnaFw').value:'';const fwS=(DNA_FRAMEWORKS.find(f=>f.nome===fw)||{}).estrutura||'';const dir=$('dnaDir')?$('dnaDir').value.trim():'';

    try{
      const res=await window.cowork.askClaude(prompt,[]);const txt=(typeof res==='string')?res:(res&&(res.text||res.content||res.output))||'';
      const get=re=>{const m=txt.match(re);return m?m[1].trim():null;};const list=re=>{const v=get(re);return v?v.split(/\s*;\s*/).map(s=>s.trim()).filter(Boolean):null;};
      const imp={...src};const a={missao:/MISSAO:\s*(.+)/i,posicionamento:/POSICIONAMENTO:\s*(.+)/i,tom:/TOM:\s*(.+)/i,publico:/PUBLICO:\s*(.+)/i,consciencia:/CONSCIENCIA:\s*(.+)/i};
      Object.keys(a).forEach(k=>{const v=get(a[k]);if(v)imp[k]=v;});
      const ls={valores:/VALORES:\s*(.+)/i,produtos:/PRODUTOS:\s*(.+)/i,ofertas:/OFERTAS:\s*(.+)/i,provas:/PROVAS:\s*(.+)/i,objecoes:/OBJECOES:\s*(.+)/i,evitar:/EVITAR:\s*(.+)/i};
      Object.keys(ls).forEach(k=>{const v=list(ls[k]);if(v)imp[k]=v;});
      apply(imp);toast('DNA Proposto gerado pela IA — revise, salve e clique em "Usar no Gerador"');
    }catch(e){toast('Não consegui gerar agora — tente novamente');}
  } else {
    apply(melhoriaDemo(src));toast('DNA Proposto gerado (demo · '+(fw.split(' (')[0])+(dir?' · '+dir:'')+') — revise e salve');
  }
}

     <div class="section-card"><div class="sc-title">🔑 Princípios</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">${e.princ.map(p=>`<div style="display:flex;gap:9px;align-items:center;background:var(--bg-tertiary);border-radius:10px;padding:10px 12px"><span style="color:${e.cor};font-weight:800">●</span><span style="font-size:.84rem">${esc(p)}</span></div>`).join('')}</div></div>`;
  if(window.innerWidth<760)document.querySelectorAll('.grid2').forEach(g=>g.style.gridTemplateColumns='1fr');
}

/* ====== REVISÃO ====== */
function renderRevisao(){
  updateBadges();
  const f=ws().copies.filter(c=>c.status==='revisao'||c.status==='rascunho');
  $('view').innerHTML=
   head('✅','linear-gradient(135deg,#f59e0b,#10b981)','Revisão','Copies em rascunho ou aguardando aprovação','')
   +`<div class="stats">${statCard('<path d="M9 11l3 3L22 4"/>','245,158,11','Em revisão',ws().copies.filter(c=>c.status==='revisao').length)}${statCard(IC.doc,'139,146,165','Rascunhos',ws().copies.filter(c=>c.status==='rascunho').length)}${statCard(IC.check,'16,185,129','Aprovadas',ws().copies.filter(c=>c.status==='aprovado').length)}</div>`
   +(f.length?`<div class="table-wrap"><table><thead><tr><th>Título</th><th>Categoria</th><th>Status</th><th>Comentários</th><th>Atualizado</th></tr></thead><tbody>${f.map(c=>`<tr onclick="openCopy('${c.id}')"><td style="font-weight:600">${esc(c.titulo)}</td><td><span class="tag" style="background:${cat(c.cat).cor}1f;color:${cat(c.cat).cor}">${cat(c.cat).ic} ${cat(c.cat).nome}</span></td><td><span class="pill ${stClass[c.status]}">${stLabel[c.status]}</span></td><td class="muted">${c.coment.length} 💬</td><td class="muted" style="font-size:.76rem">${c.upd}</td></tr>`).join('')}</tbody></table></div>`:`<div class="table-wrap"><div class="empty"><div class="empty-ic">✅</div><p style="font-weight:600;color:var(--text-primary)">Tudo revisado!</p><p style="margin-top:4px">Nenhuma copy aguardando revisão.</p></div></div>`);
}

/* ====== TEMA ====== */
function toggleTheme(){
  const d=document.documentElement.getAttribute('data-theme')==='dark';
  document.documentElement.setAttribute('data-theme',d?'light':'dark');
  $('theme-lbl').textContent=d?'Tema escuro':'Tema claro';
  try{localStorage.setItem('uc_theme',d?'light':'dark')}catch(e){}
}
try{const t=localStorage.getItem('uc_theme');if(t){document.documentElement.setAttribute('data-theme',t);$('theme-lbl').textContent=t==='dark'?'Tema claro':'Tema escuro';}}catch(e){}

/* ========================================================================
   INTEGRAÇÃO COM A API (backend real) — sobrescreve a camada localStorage.
   Boot = login + hidratação; mutações = write-through assíncrono na API.
   ======================================================================== */
const API_BASE='https://univercopy-api.univerzap.cloud';
const UC_EMAIL='diego@univerzap.cloud';
let UC_TOKEN=''; try{UC_TOKEN=localStorage.getItem('uc_token')||'';}catch(_){}
async function ucReq(method,path,body){
  const r=await fetch(API_BASE+path,{method,headers:{'content-type':'application/json',...(UC_TOKEN?{authorization:'Bearer '+UC_TOKEN}:{})},body:body!==undefined?JSON.stringify(body):undefined});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.error||(method+' '+path+' → '+r.status));
  return d;
}
async function ucLogin(){const r=await ucReq('POST','/auth/login',{email:UC_EMAIL,name:'Diego'});UC_TOKEN=r.token;try{localStorage.setItem('uc_token',r.token)}catch(_){}return r.user;}
const _asArr=v=>Array.isArray(v)?v:(typeof v==='string'?(()=>{try{const p=JSON.parse(v);return Array.isArray(p)?p:(v?[v]:[])}catch(_){return v?[v]:[]}})():(v||[]));
function fmtWhen(ts){if(!ts)return 'agora';const d=new Date(ts),s=(Date.now()-d.getTime())/1000;if(s<60)return 'agora';if(s<3600)return 'há '+Math.floor(s/60)+' min';if(s<86400)return 'há '+Math.floor(s/3600)+'h';const dd=Math.floor(s/86400);return 'há '+dd+(dd===1?' dia':' dias');}
function adaptDnaRow(row){row=row||{};return {marca:row.marca||'',missao:row.missao||'',posicionamento:row.posicionamento||'',tom:row.tom||'',publico:row.publico||'',consciencia:row.consciencia||'',valores:_asArr(row.valores),produtos:_asArr(row.produtos),ofertas:_asArr(row.ofertas),provas:_asArr(row.provas),objecoes:_asArr(row.objecoes),evitar:_asArr(row.evitar)};}
function adaptWsRow(row){return {id:row.id,nome:row.name||row.nome||'Marca',icon:row.icon||'🧬',site_url:row.site_url||'',dna:{usar:'atual',atual:emptyDna(row.name||'Marca'),proposto:emptyDna(row.name||'Marca')},copies:[],refs:[],loaded:false};}
function adaptCopyRow(row,marca){return {id:row.id,titulo:row.title||'(sem título)',cat:row.category_key||'ecom',tipo:row.piece_type_key||'',status:row.status||'rascunho',marca:marca||'',estilo:row.style_key||'',fw:row.framework_key||'',score:row.score||0,upd:fmtWhen(row.updated_at),conteudo:row.current_content||'',versoes:[{n:1,autor:'',data:fmtWhen(row.updated_at),nota:'versão atual',atual:true}],coment:[]};}
async function loadWs(w){
  if(!w||w.loaded)return;
  try{const dres=await ucReq('GET','/workspaces/'+w.id+'/dna');const byKind={};(dres.dna||[]).forEach(r=>byKind[r.kind]=adaptDnaRow(r));w.dna={usar:(dres.in_use||'atual'),atual:byKind.atual||emptyDna(w.nome),proposto:byKind.proposto||emptyDna(w.nome)};}catch(e){}
  try{const cps=await ucReq('GET','/workspaces/'+w.id+'/copies');w.copies=cps.map(c=>adaptCopyRow(c,w.nome));}catch(e){w.copies=[];}
  w.loaded=true;
}
async function ensureSeed(){const sd=seed().workspaces[0];const created=await ucReq('POST','/workspaces',{name:sd.nome,icon:sd.icon});try{await ucReq('PUT','/workspaces/'+created.id+'/dna/atual',sd.dna.atual);}catch(_){}return created;}
async function boot(){
  try{await ucLogin();}catch(e){$('view').innerHTML='<div class="empty"><div class="empty-ic">⚠️</div><p style="font-weight:600;color:var(--text-primary)">Não consegui conectar à API</p><p>'+esc(e.message)+'</p></div>';return;}
  let wss=[];try{wss=await ucReq('GET','/workspaces');}catch(e){}
  if(!wss.length){try{await ensureSeed();wss=await ucReq('GET','/workspaces');}catch(e){}}
  DB={workspaces:wss.map(adaptWsRow),activeWs:null,seq:100};
  window._dnaTab='atual';
  if(DB.workspaces.length){DB.activeWs=DB.workspaces[0].id;await loadWs(ws());updateBadges();nav('dash');}
  else{$('view').innerHTML='<div class="empty"><div class="empty-ic">🧬</div><p style="font-weight:600;color:var(--text-primary)">Nenhuma marca ainda</p><p>Crie seu primeiro workspace para começar.</p><button class="btn btn-primary" style="margin-top:14px" onclick="novoWorkspace()">＋ Criar workspace</button></div>';}
}
async function novoWorkspace(){
  const nome=prompt('Nome da nova marca / workspace:','Nova marca');if(nome===null)return;
  try{const created=await ucReq('POST','/workspaces',{name:nome||'Nova marca',icon:'🧬'});const w=adaptWsRow(created);DB.workspaces.push(w);DB.activeWs=w.id;window._dnaTab='atual';await loadWs(w);updateBadges();nav('dna');toast('Workspace criado — preencha o DNA da marca');}
  catch(e){toast('Erro ao criar: '+e.message);}
}
async function switchWs(id){
  DB.activeWs=id;window._dnaTab='atual';window._aCat='all';window._aStatus='';
  const w=ws();if(w&&!w.loaded){try{await loadWs(w);}catch(e){}}
  updateBadges();nav('dash');
}
async function excluirWorkspace(){
  if(DB.workspaces.length<=1){toast('Mantenha ao menos um workspace');return;}
  if(!confirm('Excluir este workspace e todo o seu conteúdo?'))return;
  const id=DB.activeWs;
  try{await ucReq('DELETE','/workspaces/'+id);}catch(e){toast('Erro ao excluir: '+e.message);return;}
  DB.workspaces=DB.workspaces.filter(w=>w.id!==id);DB.activeWs=DB.workspaces[0].id;window._dnaTab='atual';
  const w=ws();if(w&&!w.loaded){try{await loadWs(w);}catch(e){}}
  updateBadges();nav('dash');toast('Workspace excluído');
}
async function saveDNA(){
  const w=ws();const kind=window._dnaTab;const data=readDnaForm();
  w.dna[kind]=data;if(kind==='atual'&&data.marca)w.nome=data.marca;
  try{await ucReq('PUT','/workspaces/'+w.id+'/dna/'+kind,data);if(kind==='atual'&&data.marca){try{await ucReq('PATCH','/workspaces/'+w.id,{name:data.marca});}catch(_){}}toast('DNA '+(kind==='atual'?'Atual':'Proposto')+' salvo');}
  catch(e){toast('Erro ao salvar DNA: '+e.message);}
  updateBadges();renderDNA();
}
async function usarDna(t){
  const w=ws();w.dna.usar=t;
  try{await ucReq('POST','/workspaces/'+w.id+'/dna/use',{kind:t});}catch(e){toast('Erro: '+e.message);}
  updateBadges();renderDNA();toast('Gerador agora usa o DNA '+(t==='atual'?'Atual':'Proposto'));
}
async function setStatus(id,s){
  const c=ws().copies.find(x=>x.id===id);if(!c)return;
  try{await ucReq('PATCH','/copies/'+id+'/status',{status:s});c.status=s;c.upd='agora';updateBadges();toast('Status: '+stLabel[s]);}
  catch(e){toast('Erro: '+e.message);}
}
async function addComment(id){
  const c=ws().copies.find(x=>x.id===id);const el=$('newComment');const v=(el.value||'').trim();if(!v)return;
  try{await ucReq('POST','/copies/'+id+'/comments',{text:v});c.coment.unshift({a:'Diego',t:v,d:'agora'});openCopy(id);toast('Comentário adicionado');}
  catch(e){toast('Erro: '+e.message);}
}
async function saveEditor(){
  const id=window._editId;const w=ws();
  const data={titulo:$('eTit').value.trim()||'(sem título)',marca:$('eMarca').value.trim(),cat:$('eCat').value,status:$('eStatus').value,estilo:$('eEst').value,fw:$('eFw').value,conteudo:$('eCont').value.trim()};
  if(id){
    const c=w.copies.find(x=>x.id===id);const changed=c.conteudo!==data.conteudo;const stChanged=c.status!==data.status;
    Object.assign(c,data);c.upd='agora';
    try{
      if(changed){await ucReq('POST','/copies/'+id+'/versions',{content:data.conteudo,note:'Edição manual'});c.versoes.unshift({n:(c.versoes[0]?.n||0)+1,autor:'Você',data:'agora',nota:'Edição manual',atual:true});}
      if(stChanged){await ucReq('PATCH','/copies/'+id+'/status',{status:data.status});}
      toast('Copy atualizada');
    }catch(e){toast('Erro ao salvar: '+e.message);}
    openCopy(id);
  }else{
    try{
      const created=await ucReq('POST','/workspaces/'+w.id+'/copies',{title:data.titulo,content:data.conteudo,category_key:data.cat,style_key:data.estilo,framework_key:data.fw});
      const nc=adaptCopyRow(created,w.nome);nc.conteudo=data.conteudo;nc.cat=data.cat;nc.estilo=data.estilo;nc.fw=data.fw;nc.titulo=data.titulo;nc.marca=data.marca;nc.status=data.status;
      if(data.status!=='rascunho'){try{await ucReq('PATCH','/copies/'+nc.id+'/status',{status:data.status});}catch(_){}}
      w.copies.unshift(nc);updateBadges();toast('Copy criada no acervo');openCopy(nc.id);
    }catch(e){toast('Erro ao criar: '+e.message);}
  }
}
async function delCopy(id){
  if(!confirm('Remover esta copy da lista? (o histórico permanece no servidor)'))return;
  ws().copies=ws().copies.filter(x=>x.id!==id);updateBadges();toast('Copy removida da lista');nav('acervo');
}
async function salvarGerado(i){
  const L=window._lastVars;if(!L)return;const p=L.p;const w=ws();
  const tnome=p.tipo?p.tipo.nome+' — ':'';const titulo=(tnome+($('gBrief').value||'Nova copy')).slice(0,56);
  const catId=$('gCat').value,tipoId=$('gTipo')?$('gTipo').value:'';
  try{
    const created=await ucReq('POST','/workspaces/'+w.id+'/copies',{title:titulo,content:L.vars[i],category_key:catId,piece_type_key:(catId&&tipoId?catId+':'+tipoId:''),style_key:$('gEst').value,framework_key:$('gFw').value});
    const nc=adaptCopyRow(created,w.nome);nc.conteudo=L.vars[i];nc.cat=catId;nc.estilo=$('gEst').value;nc.fw=$('gFw').value;nc.titulo=titulo;nc.versoes=[{n:1,autor:'IA UniverCopy',data:'agora',nota:'Geração inicial · estilo '+p.e.nome,atual:true}];
    w.copies.unshift(nc);updateBadges();toast('Variação salva no acervo');nav('acervo');
  }catch(e){toast('Erro ao salvar: '+e.message);}
}
async function gerar(){
  const brief=$('gBrief').value||'seu produto';const catId=$('gCat').value,tipoId=$('gTipo')?$('gTipo').value:'';
  const p=buildPrompt(brief,catId,$('gFw').value,$('gEst').value,$('gRef').value,tipoId);
  const out=$('ger-out');out.innerHTML='<div class="muted" style="padding:24px;text-align:center">⏳ Gerando no estilo '+esc(p.e.nome)+'… <span class="muted">(Claude no servidor)</span></div>';
  let vars=[];
  try{
    const res=await ucReq('POST','/workspaces/'+ws().id+'/generate',{brief,categoryKey:catId,pieceTypeKey:(catId&&tipoId?catId+':'+tipoId:undefined),styleKey:$('gEst').value,frameworkKey:$('gFw').value,referenceId:($('gRef').value||undefined)});
    vars=(res.variations||[]).map(v=>typeof v==='string'?v:(v&&(v.text||v.content)||String(v))).filter(Boolean);
  }catch(e){out.innerHTML='<div class="muted" style="padding:24px;text-align:center;color:var(--danger)">Falha na geração: '+esc(e.message)+'</div>';return;}
  if(!vars.length){out.innerHTML='<div class="muted" style="padding:24px;text-align:center">A IA não retornou variações — tente novamente.</div>';return;}
  window._lastVars={vars,p};
  out.innerHTML=`<div style="font-size:.74rem;color:var(--text-muted);margin-bottom:10px">Estilo <b style="color:${p.e.cor}">${esc(p.e.nome)}</b> · ${esc(p.fw)} · <span style="color:var(--success);font-weight:700">gerado ao vivo (Claude)</span></div>`
   +vars.map((v,i)=>`<div class="var-out">${esc(v)}</div><button class="btn btn-sm" style="margin:-4px 0 14px" onclick="salvarGerado(${i})">＋ Salvar variação ${i+1} no acervo</button>`).join('');
}
async function analisar(){
  const url=($('anUrl').value||'').trim();if(!url){toast('Informe uma URL');return;}
  const out=$('analise-out');out.innerHTML='<div class="muted" style="padding:24px;text-align:center">🔍 Analisando a copy de '+esc(url)+'… <span class="muted">(busca + IA no servidor — pode levar alguns segundos)</span></div>';
  try{
    const res=await ucReq('POST','/workspaces/'+ws().id+'/audit',{url});
    const secs=_asArr(res.sections).map(s=>({nome:s.nome||'Seção',sev:s.sev||'médio',cat:'ecom',tipo:'',atual:s.atual||'',diag:_asArr(s.diag),brief:s.recomendacao||''}));
    window._lastAudit={url,marca:ws().nome,score:res.score||0,demo:false,resumo:res.summary||'',stats:{secoes:secs.length,problemas:secs.filter(s=>s.sev==='alto').length,oportunidades:secs.length},secoes:secs,antesDepois:null};
    drawAudit();
  }catch(e){out.innerHTML='<div class="muted" style="padding:24px;text-align:center;color:var(--danger)">Falha ao analisar: '+esc(e.message)+'</div>';}
}
async function resetDemo(){
  if(!confirm('Recarregar os dados do servidor?'))return;
  DB.workspaces.forEach(w=>w.loaded=false);const w=ws();if(w)await loadWs(w);
  updateBadges();nav('dash');toast('Recarregado do servidor');
}
boot();
</script>
