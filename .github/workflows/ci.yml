name: CI

on:
  push:
    branches: [worldclass, main]
  pull_request:
    branches: [worldclass, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  # ----------------------------------------------------------
  # Secrets scan — soft fail durante bootstrap; hard fail Fase 9.
  # ----------------------------------------------------------
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ""

  # ----------------------------------------------------------
  # SAST TS/JS — semgrep com regras open-source p/r2c-ci.
  # Continua se faltar SEMGREP_APP_TOKEN (token só liga features extras).
  # ----------------------------------------------------------
  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: returntocorp/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep ci --config "p/r2c-ci" --no-suppress-errors || true

  # ----------------------------------------------------------
  # Shared package — tipos compartilhados (TS estrito).
  # ----------------------------------------------------------
  shared:
    name: shared (type-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @univer/shared type-check

  # ----------------------------------------------------------
  # Admin (Next.js) — lint + type-check + build + unit tests.
  # ----------------------------------------------------------
  admin:
    name: admin (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter admin lint
      - run: pnpm --filter admin type-check
      - run: pnpm --filter admin test
      - run: pnpm --filter admin build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NEXT_PUBLIC_ADMIN_URL: http://localhost:3000

  # ----------------------------------------------------------
  # Landing — lint + type-check + build.
  # ----------------------------------------------------------
  landing:
    name: landing (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter landing lint
      - run: pnpm --filter landing type-check
      - run: pnpm --filter landing build

  # ----------------------------------------------------------
  # API Ruby — Brakeman + bundler-audit + RSpec + coverage gate.
  # ----------------------------------------------------------
  api:
    name: api (Rails)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: univercopy
          POSTGRES_PASSWORD: univercopy_test
          POSTGRES_DB: univercopy_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U univercopy -d univercopy_test"
          --health-interval=5s --health-timeout=3s --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=10

    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://univercopy:univercopy_test@localhost:5432/univercopy_test
      REDIS_URL: redis://localhost:6379/0
      COVERAGE_FLOOR: '30'
      SECRET_KEY_BASE: dummy_secret_key_base_for_ci_only_64_chars_long_xxxxxxxxxxxxxxxxx

    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: apps/api
          bundler-cache: true
      - name: DB setup
        working-directory: apps/api
        run: bin/rails db:prepare
      - name: Brakeman
        working-directory: apps/api
        run: bundle exec brakeman --no-pager --exit-on-warn
      - name: bundler-audit
        working-directory: apps/api
        run: bundle exec bundle-audit check --update
      - name: RSpec
        working-directory: apps/api
        run: bundle exec rspec --format progress

  # ----------------------------------------------------------
  # Meta-job: agrega resultado de TODOS jobs required.
  # gitleaks + semgrep estão soft (continue-on-error) na Fase 1.
  # ----------------------------------------------------------
  ci-passed:
    name: CI Passed
    if: always()
    needs: [shared, admin, landing, api]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed
        run: |
          if [[ "${{ needs.shared.result }}" == "failure" || \
                "${{ needs.admin.result }}" == "failure" || \
                "${{ needs.landing.result }}" == "failure" || \
                "${{ needs.api.result }}" == "failure" ]]; then
            echo "One or more required jobs failed."
            exit 1
          fi
          echo "All required jobs passed."
