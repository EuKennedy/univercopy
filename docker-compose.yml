# Stack de produção — Coolify (Hostinger) lê este arquivo.
# Tráfego HTTPS via Traefik (gerenciado pelo Coolify). Portas internas só.
# Domínios apontados via UI do Coolify: app.* → admin, api.* → api.
#
# Secrets: defina em "Environment Variables" do Coolify. Nenhum valor real aqui.

services:

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - uc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  cache:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - uc_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - uc_minio:/data
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    # Roda migrations a cada deploy ANTES de subir o puma. db:prepare é
    # idempotente (migra o que falta; semeia só se o banco for novo). Sem isso
    # o entrypoint só migra quando o comando é `rails server` — e aqui é puma,
    # então migrations nunca aplicavam no deploy.
    command: ["sh", "-c", "bundle exec rails db:prepare && exec bundle exec puma -C config/puma.rb"]
    environment:
      RAILS_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@cache:6379/0
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      TENANT_CREDENTIALS_KEY: ${TENANT_CREDENTIALS_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET}
      BILLING_WEBHOOK_SECRET: ${BILLING_WEBHOOK_SECRET}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL}
      API_URL: ${API_URL}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SENTRY_DSN: ${SENTRY_DSN}
      RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-5}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      # Blog WordPress via SSH + wp-cli. Só o `api` precisa — a publicação é
      # síncrona no request, não passa por job.
      WP_SSH_HOST: ${WP_SSH_HOST}
      WP_SSH_PORT: ${WP_SSH_PORT:-22}
      WP_SSH_USER: ${WP_SSH_USER}
      WP_SSH_KEY_B64: ${WP_SSH_KEY_B64}
      WP_SSH_KNOWN_HOSTS: ${WP_SSH_KNOWN_HOSTS}
      WP_PATH: ${WP_PATH}
      WP_CLI_BIN: ${WP_CLI_BIN:-/usr/local/bin/wp}
      WP_AUTHOR_ID: ${WP_AUTHOR_ID}
    depends_on:
      db: { condition: service_healthy }
      cache: { condition: service_healthy }
      minio: { condition: service_healthy }
    expose:
      - "3000"

  sidekiq:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    command: ["bundle", "exec", "sidekiq"]
    environment:
      RAILS_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@cache:6379/0
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      TENANT_CREDENTIALS_KEY: ${TENANT_CREDENTIALS_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      SIDEKIQ_CONCURRENCY: ${SIDEKIQ_CONCURRENCY:-10}
      SENTRY_DSN: ${SENTRY_DSN}
    depends_on:
      db: { condition: service_healthy }
      cache: { condition: service_healthy }

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Server-runtime URLs (lidos no api-client.ts e lib/auth.ts).
      # INTERNAL_API_URL = service-name na rede do compose. Server-side
      # admin chama Rails direto sem passar pelo Traefik/TLS público.
      INTERNAL_API_URL: http://api:3000
      API_URL: ${API_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      BETTER_AUTH_URL: ${FRONTEND_URL}
      # NEXT_PUBLIC_* viram inline no bundle (build-time) — passamos como
      # fallback de runtime caso o code path use process.env diretamente.
      NEXT_PUBLIC_API_URL: ${API_URL}
      NEXT_PUBLIC_ADMIN_URL: ${FRONTEND_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
    depends_on:
      db: { condition: service_healthy }
    expose:
      - "3000"

  landing:
    build:
      context: .
      dockerfile: apps/landing/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
    expose:
      - "3000"

volumes:
  uc_pgdata:
  uc_redis:
  uc_minio:
